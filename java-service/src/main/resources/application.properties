server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aegis}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aegis}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:aegis}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=aegis-java-consumer
spring.kafka.consumer.auto-offset-reset=earliest

management.endpoints.web.exposure.include=health,metrics

# FaultScope telemetry
spring.kafka.producer.properties.max.block.ms=2000
faultscope.telemetry.topic=${TELEMETRY_TOPIC:telemetry}
faultscope.service-name=${SERVICE_NAME:java-service}
faultscope.cpp-service.url=${CPP_SERVICE_URL:http://cpp-service:8082}
