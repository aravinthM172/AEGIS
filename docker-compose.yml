services:

  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    labels:
      faultscope.injectable: "true"
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    labels:
      faultscope.injectable: "true"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    container_name: aegis-kafka
    labels:
      faultscope.injectable: "true"
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - aegis-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  aegis:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: aegis-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:aegis@postgres:5432/aegis
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FAULTSCOPE_ENV: local
      FAULTSCOPE_API_KEYS: ${FAULTSCOPE_API_KEYS:-dev-operator-key:operator,dev-admin-key:admin}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      FAULT_AGENT_URL: http://fault-agent:8095
      FAULT_AGENT_TOKEN: ${FAULT_AGENT_TOKEN:-dev-token-change-me}
      FAULTSCOPE_REQUIRE_AUTH_FOR_READS: ${FAULTSCOPE_REQUIRE_AUTH_FOR_READS:-0}
      FAULTSCOPE_STRICT_SECURITY: ${FAULTSCOPE_STRICT_SECURITY:-0}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - aegis-network

  kafka-consumer:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: aegis-kafka-consumer
    command: python -m app.kafka_consumer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: aegis-incidents
      KAFKA_GROUP_ID: aegis-python-consumer
    networks:
      - aegis-network

  telemetry-consumer:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: aegis-telemetry-consumer
    command: python -m app.telemetry_consumer
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:aegis@postgres:5432/aegis
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TELEMETRY_TOPIC: telemetry
    networks:
      - aegis-network

  gateway:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: aegis-gateway
    labels:
      faultscope.injectable: "true"
      faultscope.fault_port: "8090"
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8090
    depends_on:
      kafka:
        condition: service_healthy
      java-service:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TELEMETRY_TOPIC: telemetry
      SERVICE_NAME: gateway
      FAULT_HOOK_TOKEN: ${FAULT_AGENT_TOKEN:-dev-token-change-me}
      JAVA_SERVICE_URL: http://java-service:8081
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      - aegis-network

  java-service:
    build:
      context: ./java-service
    container_name: aegis-java-service
    labels:
      faultscope.injectable: "true"
      faultscope.fault_port: "8081"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aegis
      SPRING_DATASOURCE_USERNAME: aegis
      SPRING_DATASOURCE_PASSWORD: aegis
      CPP_SERVICE_URL: http://cpp-service:8082
      FAULT_HOOK_TOKEN: ${FAULT_AGENT_TOKEN:-dev-token-change-me}
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - aegis-network

  cpp-service:
    build:
      context: ./cpp-service
    container_name: aegis-cpp-service
    labels:
      faultscope.injectable: "true"
      faultscope.fault_port: "8082"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TELEMETRY_TOPIC: telemetry
      SERVICE_NAME: cpp-service
      FAULT_HOOK_TOKEN: ${FAULT_AGENT_TOKEN:-dev-token-change-me}
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - aegis-network

  fault-agent:
    build: ./fault-agent
    image: faultscope/fault-agent:local
    container_name: aegis-fault-agent
    environment:
      FAULT_AGENT_TOKEN: ${FAULT_AGENT_TOKEN:-dev-token-change-me}
      FAULT_AGENT_IMAGE: faultscope/fault-agent:local
      FAULT_AGENT_STATE: /data/state.json
      FAULT_HOOK_TOKEN: ${FAULT_AGENT_TOKEN:-dev-token-change-me}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - fault_agent_data:/data
    ports:
      - "127.0.0.1:8095:8095"
    networks:
      - aegis-network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: aegis-frontend
    depends_on:
      - aegis
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - aegis-network

volumes:
  fault_agent_data:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  aegis-network:
    driver: bridge